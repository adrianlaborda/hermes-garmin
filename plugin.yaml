name: garmin-connect
label: Garmin Connect (unofficial)
kind: standalone
version: "0.1.0"
author: adrianlaborda
license: MIT
homepage: https://github.com/adrianlaborda/hermes-garmin
description: >-
  Read-only Garmin Connect data (sleep, HRV, Body Battery, stress, steps, heart rate, activities, heart-rate
  zones, fitness age, weight) through Garmin's official Personal API, with deterministic baselines, training
  intensity and trend flags. Unofficial.
requires_hermes: ">=0.22.2"
# Same variable as config_schema.api_key: requires_env makes `hermes plugins install` prompt for it and
# Desktop's install toast flag it; it does not block loading or enabling. Desktop users enter it in the
# api_key field of Settings > Plugins > garmin-connect.
requires_env:
  - name: GARMIN_PERSONAL_API_KEY
    description: >-
      Garmin Connect Personal API key. Create it in Garmin Connect Web under Settings > Personal API Key
      (the key is shown once, and expires after the 30, 90, 180 or 365 days you choose).
    url: https://connect.garmin.com/app/settings/personalApiToken
    secret: true
provides_tools:
  - garmin_today
  - garmin_sleep
  - garmin_hrv
  - garmin_body_battery
  - garmin_stress
  - garmin_steps
  - garmin_heart_rate
  - garmin_activities
  - garmin_activity
  - garmin_activity_fit
  - garmin_body
  - garmin_trends
  - garmin_training_load
  - garmin_fitness_age
provides_hooks:
  - pre_llm_call
config_schema:
  api_key:
    type: secret
    env: GARMIN_PERSONAL_API_KEY
    required: true
    label: Garmin Personal API key
    description: >-
      Create it in Garmin Connect on the web, Settings > Personal API Key
      (https://connect.garmin.com/app/settings/personalApiToken). Garmin shows it once and it expires after the
      30 to 365 days you pick; paste a new one here when it does. Never paste it into a chat.
  region:
    type: str
    choices: [global, china]
    default: global
    label: Garmin server
    description: "global = personal.connectapi.garmin.com; china = personal.connectapi.garmin.cn (Garmin China accounts)"
