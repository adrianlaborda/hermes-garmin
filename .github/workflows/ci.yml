name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest 'httpx>=0.27,<0.29' pyyaml 'fastapi>=0.110,<1'

      - name: Run tests
        run: python -m pytest -q

  validate:
    name: hermes plugins validate (latest stable Hermes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false

      - name: Find the latest stable Hermes release
        id: hermes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo NousResearch/hermes-agent --json tagName --jq .tagName)
          echo "Hermes release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out Hermes at that tag
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.hermes.outputs.tag }}
          path: hermes-agent
          persist-credentials: false

      # Hermes pins its dependencies in uv.lock (Python 3.14) and the uv version in pm/lock.json;
      # an older uv cannot read that lockfile, so install the version Hermes itself locks.
      - name: Read Hermes' locked uv version
        id: uv
        run: echo "version=$(jq -r '.packages.uv.version' hermes-agent/pm/lock.json)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.uv.outputs.version }}

      - name: Install Hermes (core dependencies only, from its lockfile)
        working-directory: hermes-agent
        run: uv sync --locked --no-default-groups --python 3.14

      # Same command as the catalog CI. --install-deps installs the plugin's requirements into this
      # throwaway Hermes environment; never run it against a Hermes install you use.
      - name: Validate the plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          hermes-agent/.venv/bin/hermes plugins validate --install-deps "$GITHUB_WORKSPACE/plugin"
